name: Free video (weekly)

on:
  schedule:
    - cron: "43 6 * * 2"   # Tuesdays 06:43 UTC, after Monday's radar
  workflow_dispatch:
    inputs:
      repo:
        description: "Optional owner/name to make a video about (default: next unused radar pick)"
        required: false
      voice_provider:
        description: "auto = your audio files if present, else Kokoro; kokoro = always synthesize; files = only your files"
        type: choice
        options: [auto, kokoro, files]
        default: auto

permissions:
  contents: write   # create a release holding the MP4
  models: read      # GitHub Models (free LLM) via GITHUB_TOKEN

env:
  BUILD_DIR: build

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/video/requirements*.txt

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Pick topic from radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC_REPO: ${{ inputs.repo }}
        run: python3 automation/video/pick_topic.py

      - name: Stop if nothing to do
        id: gate
        run: |
          if [ -f build/topic.json ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No topic; stopping."; fi

      - name: Restore LLM rate-limit state
        uses: actions/cache@v4
        with:
          path: .llm-state
          key: llm-state-${{ github.run_id }}
          restore-keys: llm-state-

      - name: Write script (LLM router, sectioned)
        if: steps.gate.outputs.go == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_STATE: .llm-state/state.json
        run: python3 automation/video/script.py

      - name: Voiceover (your audio files and/or Kokoro on CPU)
        if: steps.gate.outputs.go == 'true'
        env:
          VOICE_PROVIDER: ${{ inputs.voice_provider }}
        run: |
          pip install -r automation/video/requirements.txt
          if [ "$(python3 automation/video/tts.py --needs-synth)" = "true" ]; then
            pip install -r automation/video/requirements-kokoro.txt
          fi
          python3 automation/video/tts.py

      - name: Build composition
        if: steps.gate.outputs.go == 'true'
        run: python3 automation/video/build_composition.py

      - name: Render (HyperFrames)
        if: steps.gate.outputs.go == 'true'
        working-directory: build/video
        run: npx --yes hyperframes@latest render

      - name: Publish MP4 as a release
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SLUG=$(python3 -c "import json;print(json.load(open('build/topic.json'))['slug'])")
          MP4=$(find build/video -name '*.mp4' | head -n1)
          [ -n "$MP4" ] || { echo "no mp4 rendered"; exit 1; }
          # editable source: script, timing and composition (re-render with `npx hyperframes render`)
          (cd build && zip -qr ../source.zip topic.json script.json durations.json video -x 'video/*.mp4')
          gh release create "video-$SLUG" "$MP4" source.zip --title "Video: $SLUG" \
            --notes "Auto-generated explainer. Source: $(python3 -c "import json;print(json.load(open('build/topic.json'))['url'])")"
