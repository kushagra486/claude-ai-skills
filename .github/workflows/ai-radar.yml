name: AI radar (weekly)

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read      # GitHub Models (free LLM) via GITHUB_TOKEN

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Discover candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 automation/radar/discover.py

      - name: Restore LLM rate-limit state
        uses: actions/cache@v4
        with:
          path: .llm-state
          key: llm-state-${{ github.run_id }}
          restore-keys: llm-state-

      - name: Draft skills with the LLM router
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_STATE: .llm-state/state.json
        run: python3 automation/radar/generate.py

      - name: Export for other tools
        run: python3 automation/radar/export.py

      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing new"; exit 0; fi
          BRANCH="radar/$(date -u +%F)"
          git config user.name "ai-radar[bot]"
          git config user.email "ai-radar@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "AI radar: weekly discoveries $(date -u +%F)"
          git push -u origin "$BRANCH"
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" \
            --title "AI radar: weekly discoveries $(date -u +%F)" \
            --body "Auto-generated. Review each new skill under plugins/ai-radar/skills/ (drafted from untrusted READMEs, so check for anything odd) and the digest in automation/radar/digests/. Delete skills you do not want, then merge."
